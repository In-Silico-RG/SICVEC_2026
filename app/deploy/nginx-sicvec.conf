server {
    listen 80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 7m;            # app limit is 6 MB (receipts)
    limit_req zone=sicvec_all burst=40 nodelay;

    # Public forms: POST attempts limited per IP (spam / abuse).
    location ~ ^/(enviar|inscripcion)$ {
        limit_req zone=sicvec_forms burst=10 nodelay;
        include /etc/nginx/sicvec-proxy.conf;
    }
    # Admin: HTTP Basic auth, so throttle guessing.
    location /admin {
        limit_req zone=sicvec_admin burst=10 nodelay;
        include /etc/nginx/sicvec-proxy.conf;
    }
    location / {
        include /etc/nginx/sicvec-proxy.conf;
    }
}
